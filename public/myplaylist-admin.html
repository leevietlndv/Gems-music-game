<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GEMS Radio — Quản lý My Playlist</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:0 12px 28px;font-family:Arial,sans-serif;background:#172033;color:#eef3f9}
    .container{width:100%;max-width:980px;margin:0 auto}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 12px}
    .nav-title{font-size:17px;font-weight:700}.nav a{color:#9ecbff;text-decoration:none;font-size:13px}
    h1{margin:8px 0 4px;font-size:22px}.subtitle{color:#9aa8bc;font-size:13px;margin-bottom:14px}
    .card{background:#202a3b;border:1px solid #34425a;border-radius:11px;padding:13px;margin-bottom:12px}
    .status{font-size:13px;line-height:1.45}.status.success{color:#7ddc8a}.status.error{color:#ff8f8f}.status.info{color:#aebbd0}
    .toolbar{display:flex;gap:8px;align-items:center}.search{flex:1;min-width:0;height:40px;border:1px solid #42516a;border-radius:8px;background:#182235;color:#eef3f9;padding:0 11px;font-size:14px;outline:none}.search:focus{border-color:#6ea8df}
    .refresh{height:40px;padding:0 12px;border:0;border-radius:8px;background:#34445d;color:#fff;font-weight:600;cursor:pointer}.refresh:disabled{opacity:.55;cursor:not-allowed}
    .summary{display:flex;justify-content:space-between;gap:8px;color:#9aa8bc;font-size:12px;margin-top:9px}.summary-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.summary-card{background:#29364b;border:1px solid #3b4960;border-radius:8px;padding:9px}.summary-label{font-size:10px;color:#8f9eb4}.summary-value{font-size:16px;font-weight:700;margin-top:3px}.detail-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px}.detail-summary .summary-card{padding:8px}
    .user-list{display:grid;gap:9px}.user-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;background:#29364b;border:1px solid #3b4960;border-radius:9px;padding:11px}
    .user-main{min-width:0}.user-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.user-id{font-size:11px;color:#a8b6ca;margin-top:4px;overflow-wrap:anywhere}.user-meta{font-size:11px;color:#8f9eb4;margin-top:6px;line-height:1.55}
    .stats{display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#34445d;color:#c9d7e8;font-size:11px}
    .detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detail-title{font-size:17px;font-weight:700}.back{height:34px;padding:0 10px;border:0;border-radius:7px;background:#34445d;color:#fff;font-weight:600;cursor:pointer}.detail-meta{color:#9aa8bc;font-size:12px;line-height:1.55;margin-top:7px}.playlist-list{display:grid;gap:8px;margin-top:10px}.playlist-row{background:#29364b;border:1px solid #3b4960;border-radius:9px;padding:10px}.playlist-row.clickable{cursor:pointer}.playlist-row.clickable:hover{border-color:#6ea8df}.playlist-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.playlist-meta{font-size:11px;color:#9aa8bc;margin-top:5px}.song-list{display:grid;gap:8px;margin-top:10px}.song-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:9px;align-items:center;background:#202a3b;border:1px solid #34425a;border-radius:8px;padding:7px}.song-thumb{width:72px;height:41px;object-fit:cover;border-radius:5px;background:#172033}.song-title{font-size:12px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}.song-id{font-size:10px;color:#8f9eb4;margin-top:3px;overflow-wrap:anywhere}.detail-empty{color:#8492a8;text-align:center;padding:14px 8px;font-size:12px}.empty{color:#8492a8;text-align:center;padding:18px 8px;font-size:13px}.hidden{display:none!important}
    @media(max-width:620px){body{padding-left:9px;padding-right:9px}.toolbar{flex-direction:column;align-items:stretch}.refresh{width:100%}.user-row{grid-template-columns:1fr}.stats{flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.summary{flex-direction:column;gap:3px}.summary-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="container">
  <div class="nav"><span class="nav-title">👥 Quản lý My Playlist</span><a href="/myplaylist.html">← My Playlist</a></div>
  <h1>Người dùng My Playlist</h1>
  <div class="subtitle">Chỉ Admin/Owner được truy cập. Owner có thể khóa hoặc mở khóa quyền sử dụng My Playlist.</div>

  <section class="card">
    <div id="status" class="status info">⏳ Đang xác thực quyền Admin...</div>
  </section>

  <section id="content" class="hidden">
    <section class="card">
      <div class="toolbar">
        <input id="search" class="search" type="search" autocomplete="off" placeholder="Tìm Telegram ID, username hoặc tên..." maxlength="100">
        <button id="refresh" class="refresh" type="button">↻ Làm mới</button>
      </div>
      <div class="summary"><span id="role"></span><span id="count">0 người dùng</span></div><div id="summaryStats" class="summary-stats"><div class="summary-card"><div class="summary-label">Người dùng</div><div id="summaryUsers" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">Đã khóa</div><div id="summaryLocked" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">Playlist</div><div id="summaryPlaylists" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">Bài hát</div><div id="summarySongs" class="summary-value">0</div></div></div>
    </section>

    <section id="listSection" class="card">
      <div id="userList" class="user-list"><div class="empty">Đang tải...</div></div>
    </section>

    <section id="detailSection" class="card hidden">
      <div class="detail-head"><div><div id="detailTitle" class="detail-title">Chi tiết người dùng</div><div id="detailMeta" class="detail-meta"></div><div id="detailSummary" class="detail-summary"></div></div><button id="backToList" class="back" type="button">← Danh sách</button></div>
      <div id="detailStatus" class="status info" style="margin-top:10px">⏳ Đang tải...</div>
      <div id="playlistList" class="playlist-list"></div>
      <div id="songDetail" class="hidden" style="margin-top:12px"></div>
    </section>
  </section>
</div>

<script>
const tg=window.Telegram?.WebApp;if(tg){try{tg.ready()}catch(e){}try{tg.expand()}catch(e){}}
let initData=tg?.initData||'';
function resolveInitData(){const data=tg?.initData||'';if(data)initData=data;return initData}
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(value){if(!value)return '—';const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return d.toLocaleString('vi-VN')}
function displayName(user){const full=[user.first_name,user.last_name].filter(Boolean).join(' ').trim();return full||(user.username?'@'+user.username:'Chưa có tên Telegram')}
function setStatus(text,type='info'){$('status').textContent=text;$('status').className='status '+type}
function updateSummary(summary){
  const s=summary||{};
  $('summaryUsers').textContent=Number(s.user_count)||0;
  $('summaryLocked').textContent=Number(s.locked_user_count)||0;
  $('summaryPlaylists').textContent=Number(s.playlist_count)||0;
  $('summarySongs').textContent=Number(s.song_count)||0;
}
function renderUsers(users){
  if(!Array.isArray(users)||users.length===0){$('userList').innerHTML='<div class="empty">Không tìm thấy người dùng My Playlist.</div>';$('count').textContent='0 người dùng';updateSummary({user_count:0,locked_user_count:0,playlist_count:0,song_count:0});return}
  $('count').textContent=`${users.length} người dùng`;
  $('userList').innerHTML=users.map(user=>{
    const username=user.username?`@${esc(user.username)}`:'Chưa có username';
    const name=esc(displayName(user));
    const id=esc(user.telegram_id);
    const playlists=Number(user.playlist_count)||0;
    const songs=Number(user.song_count)||0;
    const locked=user.is_locked===true;
    const lockButton=currentRequesterRole==='owner'
      ? `<button class="lock-btn" type="button" data-lock-action="${locked?'unlock':'lock'}" title="${locked?'Mở khóa My Playlist':'Khóa My Playlist'}">${locked?'🔓':'🔒'}</button>`
      : '';
    return `<div class="user-row" data-telegram-id="${id}" role="button" tabindex="0"><div class="user-main"><div class="user-name">${name}</div><div class="user-id">${username} · Telegram ID: ${id}</div><div class="user-meta">Đăng ký: ${esc(formatDate(user.registered_at))}<br>Lần cuối hoạt động: ${esc(formatDate(user.last_seen_at))}</div></div><div class="stats"><span class="badge">📁 ${playlists} playlist</span><span class="badge">🎵 ${songs} bài hát</span>${locked?'<span class="badge">🔒 Đã khóa</span>':''}${lockButton}</div></div>`;
  }).join('');
  $('userList').querySelectorAll('.user-row').forEach(row=>{
    const open=()=>openUserDetail(row.dataset.telegramId);
    row.addEventListener('click',e=>{
      if(e.target.closest('.lock-btn'))return;
      open();
    });
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    const lockBtn=row.querySelector('.lock-btn');
    if(lockBtn){
      lockBtn.addEventListener('click',async e=>{
        e.stopPropagation();
        const locked=lockBtn.dataset.lockAction==='lock';
        await toggleMyPlaylistUserLock(row.dataset.telegramId,locked);
      });
    }
  });
}

async function toggleMyPlaylistUserLock(telegramId, locked){
  resolveInitData();
  if(currentRequesterRole!=='owner'||!initData)return;
  const action=locked?'khóa':'mở khóa';
  if(!confirm(`Bạn có chắc muốn ${action} My Playlist của Telegram ID ${telegramId}?`))return;
  try{
    const response=await fetch(`/api/my-playlist-users/${encodeURIComponent(telegramId)}/${locked?'lock':'unlock'}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true){
      alert(`❌ ${data.message||`Không thể ${action} My Playlist.`}`);
      return;
    }
    await loadUsers();
    setStatus(`✅ Đã ${locked?'khóa':'mở khóa'} My Playlist cho Telegram ID ${telegramId}.`,'success');
  }catch(error){
    console.error('My Playlist lock/unlock error:',error);
    alert('❌ Lỗi kết nối máy chủ.');
  }
}

let currentDetail=null;
let openPlaylistId=null;
let currentRequesterRole='admin';
function setDetailStatus(text,type='info'){$('detailStatus').textContent=text;$('detailStatus').className='status '+type}
function renderUserDetail(data){
  const user=data.user||{};
  const role=data.requesterRole==='owner'?'Owner':'Admin';
  const name=esc(displayName(user));
  const username=user.username?`@${esc(user.username)}`:'Chưa có username';
  $('detailTitle').textContent=name;
  $('detailMeta').innerHTML=`${username} · Telegram ID: ${esc(user.telegram_id)}<br>Đăng ký: ${esc(formatDate(user.registered_at))} · Lần cuối hoạt động: ${esc(formatDate(user.last_seen_at))}<br>Quyền đang xem: ${role}`;
  const detailSummary=data.summary||{};
  $('detailSummary').innerHTML=`<div class="summary-card"><div class="summary-label">Playlist</div><div class="summary-value">${Number(detailSummary.playlistCount)||0}</div></div><div class="summary-card"><div class="summary-label">Bài hát</div><div class="summary-value">${Number(detailSummary.songCount)||0}</div></div>`;
  const playlists=Array.isArray(data.playlists)?data.playlists:[];
  $('playlistList').innerHTML=playlists.length?playlists.map(p=>{
    const canOpen=data.requesterRole==='owner';
    return `<div class="playlist-row${canOpen?' clickable':''}" data-playlist-id="${esc(p.id)}"><div class="playlist-name">📁 ${esc(p.name)}</div><div class="playlist-meta">${Number(p.song_count)||0} bài hát · Cập nhật: ${esc(formatDate(p.updated_at))}${canOpen?' · Bấm để xem bài hát':''}</div></div>`;
  }).join(''):'<div class="detail-empty">Người dùng chưa có playlist nào.</div>';
  $('songDetail').classList.add('hidden');
  $('songDetail').innerHTML='';
  if(data.requesterRole==='owner'){
    $('playlistList').querySelectorAll('.playlist-row').forEach(row=>row.addEventListener('click',()=>showPlaylistSongs(row.dataset.playlistId)));
  }
}
function showPlaylistSongs(playlistId){
  if(!currentDetail||currentDetail.requesterRole!=='owner')return;
  const playlist=(currentDetail.playlists||[]).find(p=>String(p.id)===String(playlistId));
  if(!playlist)return;

  // Click lần 2 vào chính playlist đang mở -> đóng danh sách bài hát.
  if(openPlaylistId===String(playlistId)){
    openPlaylistId=null;
    $('songDetail').classList.add('hidden');
    $('playlistList').querySelectorAll('.playlist-row').forEach(row=>row.classList.remove('expanded'));
    return;
  }

  openPlaylistId=String(playlistId);
  const songs=Array.isArray(playlist.songs)?playlist.songs:[];
  $('playlistList').querySelectorAll('.playlist-row').forEach(row=>row.classList.toggle('expanded',row.dataset.playlistId===openPlaylistId));
  $('songDetail').classList.remove('hidden');
  $('songDetail').innerHTML=`<div class="detail-title">🎵 ${esc(playlist.name)}</div><div class="detail-meta">${songs.length} bài hát · Thứ tự playlist</div>${songs.length?`<div class="song-list">${songs.map(song=>`<div class="song-row"><img class="song-thumb" src="${esc(song.thumbnail_url||'')}" alt=""><div><div class="song-title">${esc(song.title||'Chưa có tiêu đề')}</div><div class="song-id">#${Number(song.position)+1} · Video ID: ${esc(song.youtube_video_id)}</div></div></div>`).join('')}</div>`:'<div class="detail-empty">Playlist này chưa có bài hát.</div>'}`;
  $('songDetail').scrollIntoView({behavior:'smooth',block:'start'});
}
async function openUserDetail(telegramId){
  resolveInitData();
  if(!initData){setStatus('⚠️ Không nhận được Telegram initData. Hãy mở trang từ Telegram Mini App.','error');return}
  $('listSection').classList.add('hidden');$('detailSection').classList.remove('hidden');
  openPlaylistId=null;
  $('detailTitle').textContent='Chi tiết người dùng';$('detailMeta').textContent='';$('playlistList').innerHTML='';$('songDetail').innerHTML='';$('songDetail').classList.add('hidden');setDetailStatus('⏳ Đang tải...');
  try{
    const response=await fetch(`/api/my-playlist-users/${encodeURIComponent(telegramId)}?initData=${encodeURIComponent(initData)}`,{method:'GET',cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true){setDetailStatus(`❌ ${data.message||'Không thể tải chi tiết người dùng.'}`,'error');return}
    currentDetail=data;
    renderUserDetail(data);
    setDetailStatus(data.user?.is_locked===true?'🔒 Tài khoản My Playlist đang bị khóa.':'','success');
  }catch(error){console.error('My Playlist user detail error:',error);setDetailStatus('❌ Lỗi kết nối máy chủ.','error')}
}

let searchTimer=null;
async function loadUsers(){
  resolveInitData();
  if(!initData){setStatus('⚠️ Không nhận được Telegram initData. Hãy mở trang từ Telegram Mini App.','error');return}
  $('refresh').disabled=true;
  const search=String($('search').value||'').trim();
  try{
    const response=await fetch(`/api/my-playlist-users?initData=${encodeURIComponent(initData)}&search=${encodeURIComponent(search)}`,{method:'GET',cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.success!==true){$('content').classList.add('hidden');setStatus(`❌ ${data.message||'Không thể tải danh sách người dùng My Playlist.'}`,'error');return}
    $('content').classList.remove('hidden');
    updateSummary(data.summary);
    currentRequesterRole=data.requesterRole==='owner'?'owner':'admin';
    $('role').textContent=data.requesterRole==='owner'?'Quyền: Owner':'Quyền: Admin';
    renderUsers(data.users||[]);
    setStatus('✅ Đã xác thực quyền quản trị.','success');
  }catch(error){console.error('My Playlist user management error:',error);setStatus('❌ Lỗi kết nối máy chủ.','error')}
  finally{$('refresh').disabled=false}
}
$('refresh').addEventListener('click',loadUsers);
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadUsers,300)});
$('backToList').addEventListener('click',()=>{$('detailSection').classList.add('hidden');$('listSection').classList.remove('hidden');currentDetail=null;openPlaylistId=null});
function waitForTelegramInitData(){
  if(resolveInitData()){loadUsers();return}
  const startedAt=Date.now();
  const timer=setInterval(()=>{if(resolveInitData()){clearInterval(timer);loadUsers();return}if(Date.now()-startedAt>=15000){clearInterval(timer);loadUsers()}},250);
}
waitForTelegramInitData();
</script>
</body>
</html>
