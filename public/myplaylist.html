<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>My Playlist</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="/shared/youtube.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#1c2333;color:#fff;padding:16px;min-height:100vh}
.container{width:100%;max-width:480px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#252f42;border:1px solid #34415a;border-radius:10px;padding:8px 10px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.nav-title{color:#64b5f6;font-size:15px;font-weight:700}
.nav a{color:#eee;text-decoration:none;font-size:13px;font-weight:600;padding:8px 10px;border-radius:7px;background:#1a2232;border:1px solid #3b4861}
.nav a:active{transform:scale(.98)}
h1{font-size:24px;text-align:center;margin:8px 0 6px}.subtitle{text-align:center;color:#aab4c5;font-size:13px;margin-bottom:16px}
.card{background:#252f42;border:1px solid #34415a;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 5px 16px rgba(0,0,0,.16)}
.hidden{display:none!important}.status{font-size:13px;color:#aab4c5;margin-bottom:12px}.status.error{color:#ff8a80}.status.ok{color:#81c784}
.register-title{font-size:18px;font-weight:700;margin-bottom:8px}.register-help{font-size:13px;line-height:1.5;color:#b8c2d2;margin-bottom:12px}
input{width:100%;height:42px;border:1px solid #46536b;border-radius:8px;background:#182031;color:#fff;padding:0 12px;font-size:14px;outline:none}input:focus{border-color:#64b5f6}
button{border:0;cursor:pointer}.primary{width:100%;height:42px;border-radius:8px;background:#2e7d32;color:#fff;font-weight:700;font-size:14px;margin-top:10px}.secondary{height:36px;border-radius:7px;background:#34415a;color:#fff;padding:0 11px;font-weight:600}.danger{background:#8e3030}.ghost{background:transparent;color:#9ecbff;padding:5px 6px;font-size:13px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.section-head h2{font-size:17px}.count{color:#91a0b7;font-size:12px}
.playlist{border:1px solid #3a4860;border-radius:10px;background:#202a3b;margin-bottom:10px;overflow:hidden}.playlist-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px}.playlist-name{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.playlist-actions{display:flex;gap:4px;flex-shrink:0}.playlist-actions button{background:transparent;color:#c9d4e5;font-size:16px;padding:5px}.playlist-body{padding:0 10px 10px;border-top:1px solid #334057}.song-list{padding-top:8px;min-height:8px}.song{display:flex;align-items:center;gap:8px;background:#29364b;border:1px solid #3b4960;border-radius:9px;padding:7px;margin-bottom:7px;cursor:grab}.song.dragging{opacity:.45}.drag{color:#8290a6;font-size:18px;width:18px;text-align:center;flex-shrink:0}.thumb{width:72px;height:42px;object-fit:cover;border-radius:6px;background:#111827;flex-shrink:0}.song-main{min-width:0;flex:1}.song-title{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.song-id{font-size:10px;color:#8190a6;margin-top:3px}.song-actions{display:flex;flex-direction:column;gap:3px}.song-actions button{background:transparent;color:#c9d4e5;padding:4px;font-size:16px}.song-actions button:disabled{opacity:.5;cursor:wait}.empty{color:#7f8ca1;text-align:center;padding:16px 8px;font-size:13px}
.add-row{display:flex;gap:7px;margin-top:10px}.add-row input{flex:1}.add-row button{height:42px;width:45px;border-radius:8px;background:#2e7d32;color:#fff;font-size:18px;font-weight:700}.playlist-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:#7f8ca1;font-size:11px}.busy{opacity:.6;pointer-events:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{width:100%;max-width:420px;background:#252f42;border:1px solid #46536b;border-radius:12px;padding:16px;box-shadow:0 15px 45px rgba(0,0,0,.5)}.modal h3{font-size:17px;margin-bottom:8px}.modal p{color:#aeb9ca;font-size:13px;line-height:1.5;margin-bottom:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.modal-actions button{height:38px;padding:0 13px;border-radius:7px;font-weight:700}.cancel{background:#34415a;color:#fff}.confirm{background:#2e7d32;color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="nav"><span class="nav-title">🎧 My Playlist</span><a href="/">← GEMS Studio</a></div>
  <h1>My Playlist</h1>
  <div class="subtitle">Lưu và sắp xếp các bài hát YouTube của riêng bạn</div>

  <div id="statusCard" class="card"><div id="status" class="status">⏳ Đang xác thực Telegram...</div></div>

  <div id="registerCard" class="card hidden">
    <div class="register-title">Đăng ký My Playlist</div>
    <div class="register-help">Nhập Telegram ID của chính tài khoản đang mở Mini App này. Máy chủ sẽ đối chiếu ID với dữ liệu Telegram trước khi đăng ký.</div>
    <input id="registerTelegramId" inputmode="numeric" autocomplete="off" placeholder="Nhập Telegram ID">
    <button id="registerBtn" class="primary">🔐 Đăng ký và mở My Playlist</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="section-head"><h2>Playlist của tôi</h2><span id="playlistCount" class="count">0 playlist</span></div>
      <button id="createPlaylistBtn" class="primary">＋ Tạo playlist mới</button>
    </div>
    <div id="playlists"></div>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3><p id="modalMessage"></p>
    <input id="modalInput" class="hidden" autocomplete="off">
    <div class="modal-actions"><button id="modalCancel" class="cancel">Hủy</button><button id="modalConfirm" class="confirm">Xác nhận</button></div>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
let initData=tg?.initData||'';
function resolveInitData(){initData=tg?.initData||initData;return !!initData}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function videoId(url){
  const raw = String(url || '').trim();

  if (
    !window.YouTubeUtils ||
    typeof window.YouTubeUtils.getYouTubeVideoId !== 'function'
  ) {
    console.error('[My Playlist] youtube.js chưa được load.', {
      page: location.href,
      youtubeUtils: window.YouTubeUtils
    });

    alert('❌ Không tải được bộ nhận diện YouTube. Vui lòng tải lại trang.');
    return null;
  }

  const id = window.YouTubeUtils.getYouTubeVideoId(raw);

  console.log('[My Playlist] YouTube parser:', {
    url: raw,
    videoId: id
  });

  return id;
}
const $=id=>document.getElementById(id);const state={playlists:[],active:null};
async function api(url,options={}){resolveInitData();const headers={'Content-Type':'application/json',...(options.headers||{})};const method=(options.method||'GET').toUpperCase();let body=options.body;if(method==='GET'){const separator=url.includes('?')?'&':'?';url=`${url}${separator}initData=${encodeURIComponent(initData)}`;}else if(body&&typeof body!=='string')body={...body,initData};else if(!body)body={initData};if(body)options.body=JSON.stringify(body);options.headers=headers;options.method=method;const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||`HTTP ${r.status}`);e.status=r.status;e.data=d;throw e}return d}
function setStatus(text,type=''){const el=$('status');el.textContent=text;el.className='status '+type}
function showRegister(){ $('statusCard').classList.add('hidden');$('registerCard').classList.remove('hidden');$('app').classList.add('hidden') }
function showApp(){ $('statusCard').classList.add('hidden');$('registerCard').classList.add('hidden');$('app').classList.remove('hidden') }
function playlistHtml(p,songs){return `<div class="playlist" data-playlist-id="${p.id}"><div class="playlist-head"><div class="playlist-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="playlist-actions"><button title="Đổi tên" data-action="rename">✏️</button><button title="Xóa playlist" data-action="delete">🗑️</button></div></div><div class="playlist-body"><div class="song-list" data-song-list="${p.id}">${songs.length?songs.map(songHtml).join(''):'<div class="empty">Playlist này chưa có bài hát.</div>'}</div><div class="add-row"><input data-add-input="${p.id}" placeholder="Dán link YouTube..." maxlength="500"><button data-action="add" title="Thêm bài hát">＋</button></div><div class="playlist-footer"><span>${songs.length} bài hát</span><span>Kéo thả để đổi thứ tự</span></div></div></div>`}
function songHtml(s){const thumb=s.thumbnailUrl||`https://i.ytimg.com/vi/${encodeURIComponent(s.youtubeVideoId)}/hqdefault.jpg`;return `<div class="song" draggable="true" data-song-id="${s.id}"><span class="drag">☷</span><img class="thumb" src="${esc(thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="song-main"><div class="song-title" title="${esc(s.title||s.youtubeUrl)}">${esc(s.title||s.youtubeUrl)}</div><div class="song-id">YouTube · ${esc(s.youtubeVideoId)}</div></div><div class="song-actions"><button title="Gửi bài hát vào GEMS Studio" data-action="send-gems">🎵</button><button title="Xóa bài hát" data-action="delete-song">🗑️</button></div></div>`}
async function loadPlaylists(){const d=await api('/api/my-playlists');const playlists=d.playlists||[];state.playlists=await Promise.all(playlists.map(async p=>{try{const sd=await api(`/api/my-playlists/${p.id}/songs`);return {...p,songs:sd.songs||[]}}catch(e){console.error('❌ Không thể tải bài hát playlist:',p.id,e);return {...p,songs:[]}}}));renderPlaylists();showApp()}
function renderPlaylists(){const wrap=$('playlists');$('playlistCount').textContent=`${state.playlists.length} playlist`;if(!state.playlists.length){wrap.innerHTML='<div class="card"><div class="empty">Chưa có playlist. Hãy tạo playlist đầu tiên.</div></div>';return}wrap.innerHTML=state.playlists.map(p=>playlistHtml(p,p.songs||[])).join('');attachDnD()}
async function createPlaylist(){const name=prompt('Tên playlist mới:','Playlist của tôi');if(name===null)return;const clean=name.trim();if(!clean){alert('Tên playlist không được để trống.');return}try{await api('/api/my-playlists',{method:'POST',body:{name:clean}});await loadPlaylists()}catch(e){alert(e.message)}}
async function renamePlaylist(id,current){const name=prompt('Tên playlist mới:',current);if(name===null)return;const clean=name.trim();if(!clean){alert('Tên playlist không được để trống.');return}try{await api(`/api/my-playlists/${id}`,{method:'PATCH',body:{name:clean}});await loadPlaylists()}catch(e){alert(e.message)}}
async function deletePlaylist(id,name){if(!confirm(`Xóa playlist “${name}” và toàn bộ bài hát bên trong?`))return;try{await api(`/api/my-playlists/${id}`,{method:'DELETE'});await loadPlaylists()}catch(e){alert(e.message)}}
async function addSong(id,input){const url=input.value.trim();if(!url){alert('Vui lòng nhập link YouTube.');return}const vid=videoId(url);if(!vid){alert('Link YouTube không hợp lệ.');return}input.disabled=true;try{await api(`/api/my-playlists/${id}/songs`,{method:'POST',body:{youtubeUrl:url,title:'',thumbnailUrl:`https://i.ytimg.com/vi/${encodeURIComponent(vid)}/hqdefault.jpg`}});input.value='';await loadPlaylists()}catch(e){alert(e.message)}finally{input.disabled=false}}
async function sendSongToGems(pid,sid,btn){const p=state.playlists.find(x=>Number(x.id)===Number(pid));const song=(p?.songs||[]).find(x=>Number(x.id)===Number(sid));if(!song)return;if(!confirm('Gửi bài hát này vào GEMS Studio?'))return;btn.disabled=true;const oldText=btn.textContent;btn.textContent='⏳';try{const result=await api('/api/submit',{method:'POST',body:{url:song.youtubeUrl}});if(!result.success){alert(result.message||'Không thể gửi bài hát vào GEMS Studio.');return}alert('✅ Đã gửi bài hát vào GEMS Studio.');}catch(e){alert(e.message||'Không thể gửi bài hát vào GEMS Studio.')}finally{btn.disabled=false;btn.textContent=oldText}}
async function deleteSong(pid,sid){if(!confirm('Xóa bài hát này khỏi playlist?'))return;try{await api(`/api/my-playlists/${pid}/songs/${sid}`,{method:'DELETE'});await loadPlaylists()}catch(e){alert(e.message)}}
function attachDnD(){document.querySelectorAll('.song-list').forEach(list=>{let dragged=null;list.querySelectorAll('.song').forEach(el=>{el.addEventListener('dragstart',()=>{dragged=el;el.classList.add('dragging')});el.addEventListener('dragend',async()=>{el.classList.remove('dragging');if(!dragged)return;const ids=[...list.querySelectorAll('.song')].map(x=>Number(x.dataset.songId));try{await api(`/api/my-playlists/${list.dataset.songList}/songs/reorder`,{method:'PATCH',body:{songIds:ids}})}catch(e){alert(e.message);await loadPlaylists()}dragged=null});el.addEventListener('dragover',e=>{e.preventDefault();if(!dragged||dragged===el)return;const rect=el.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;list.insertBefore(dragged,after?el.nextSibling:el)})})})}
$('createPlaylistBtn').addEventListener('click',createPlaylist);
$('registerBtn').addEventListener('click',async()=>{const id=$('registerTelegramId').value.trim();if(!/^\d+$/.test(id)){alert('Telegram ID chỉ được chứa chữ số.');return}const b=$('registerBtn');b.disabled=true;b.textContent='⏳ Đang đăng ký...';try{await api('/api/my-playlist/register',{method:'POST',body:{telegramId:id}});await loadPlaylists()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='🔐 Đăng ký và mở My Playlist'}});
$('playlists').addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;const box=e.target.closest('.playlist');if(!box)return;const id=Number(box.dataset.playlistId);const p=state.playlists.find(x=>Number(x.id)===id);const action=btn.dataset.action;if(action==='rename')return renamePlaylist(id,p?.name||'');if(action==='delete')return deletePlaylist(id,p?.name||'playlist');if(action==='send-gems'){const song=e.target.closest('.song');return sendSongToGems(id,Number(song.dataset.songId),btn)}if(action==='delete-song'){const song=e.target.closest('.song');return deleteSong(id,Number(song.dataset.songId))}if(action==='add'){const input=box.querySelector(`[data-add-input="${id}"]`);return addSong(id,input)}});
$('playlists').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-add-input]')){const id=Number(e.target.dataset.addInput);addSong(id,e.target)}});
async function boot(){resolveInitData();if(!tg||!initData){setStatus('⚠️ Hãy mở My Playlist từ Telegram Mini App.','error');return}try{await loadPlaylists()}catch(e){if(e.status===403&&e.data?.code==='MY_PLAYLIST_NOT_REGISTERED'){showRegister();return}setStatus('❌ '+e.message,'error')}}
boot();
</script>
</body></html>
