      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
if (tg) { 
  tg.ready(); 
  tg.expand(); 
}

const telegramInitData = tg?.initData || '';

console.log('📱 Telegram WebApp:', {
  available: !!tg,
  platform: tg?.platform || 'unknown',
  version: tg?.version || 'unknown',
  initDataLength: telegramInitData.length,
  userId: tg?.initDataUnsafe?.user?.id || null
});

if (!tg) {
  console.warn('⚠️ Trang này không được mở bên trong Telegram Mini App.');
}

function getTelegramUserData() {
      const u = tg?.initDataUnsafe?.user;
      if (!u) return { name: 'Người dùng', id: null };
      
      const first = (u.first_name || '').trim();
      const last = (u.last_name || '').trim();
      const combined = `${first} ${last}`.trim();
      
      return {
        name: combined || u.username || 'Người dùng',
        id: u.id
      };
    }

    const userData = getTelegramUserData();
    const socket = io();

    const deviceInfo = {
      platform: tg?.platform || '',
      userAgent: navigator.userAgent || ''
    };

    const statusBadge = document.getElementById('statusBadge');
    const songUrlInput = document.getElementById('songUrl');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpin = document.getElementById('btnSpin');
    const btnToggleForm = document.getElementById('btnToggleForm');
    const btnAutoPlay = document.getElementById('btnAutoPlay');
    const btnReset = document.getElementById('btnReset');
    const adminPanel = document.getElementById('adminPanel');
    const songListEl = document.getElementById('songList');
    const listTitleEl = document.getElementById('listTitle');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const playerCard = document.getElementById('playerCard');
    const winnerUser = document.getElementById('winnerUser');
    const winnerAction = document.getElementById('winnerAction');
    const healthBar = document.getElementById('healthBar');
    const healthStatus = document.getElementById('healthStatus');
    const likeCount = document.getElementById('likeCount');
    const dislikeCount = document.getElementById('dislikeCount');
    const btnLike = document.getElementById('btnLike');
    const btnDislike = document.getElementById('btnDislike');
    const ytPlayer = document.getElementById('ytPlayer');
    const audioNotice = document.getElementById('audioNotice');
    const btnAudioToggle = document.getElementById('btnAudioToggle');
    const btnPlaybackToggle = document.getElementById('btnPlaybackToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const volumeIcon = document.getElementById('volumeIcon');
    const playbackTimeline = document.getElementById('playbackTimeline');
    const playbackTime = document.getElementById('playbackTime');
    const onlineUserCount = document.getElementById('onlineUserCount');
    const onlineDetailsToggle = document.getElementById('onlineDetailsToggle');
    const onlineToggleIcon = document.getElementById('onlineToggleIcon');
    const onlineDetails = document.getElementById('onlineDetails');
    const onlineUserList = document.getElementById('onlineUserList');
    const onlineConnectionDetails = document.getElementById('onlineConnectionDetails');

    const MUSIC_PREF_KEY = 'gemsMusicAudioPreference';
    const VOLUME_PREF_KEY = 'gemsMusicVolume';

    let isFormOpen = true;
    let songs = [];
    let isSpinning = false;
    let isAdmin = false;
    let currentAngle = 0;
    let currentPlayingUrl = null;
    let currentAction = null;
    let currentHealth = 5;
    let currentVote = 0; // 1 = Like, -1 = Dislike, 0 = chưa vote
    let currentLikeCount = 0;
    let currentDislikeCount = 0;
    let replacementCountdown = null;

    // Trạng thái khóa thao tác chọn bài dùng chung cho toàn bộ Mini App.
    // Server là nguồn sự thật; mọi client chỉ phản ánh trạng thái này.
    let songActionLock = { active: false, type: null, until: 0, version: 0 };
    let latestSongActionVersion = 0;

    let youtubeApiPlayer = null;
    let youtubeApiReady = false;
    let youtubeApiReadyCallbacks = [];
    let currentPlayback = { songId: null, status: 'stopped', position: 0, serverTime: 0, version: 0, authoritySocketId: null, startAt: null, controlLockUntil: 0 };
    let pendingPlayback = null;
    let playbackSyncTimer = null;
    let playbackSyncBusy = false;
    let playbackTimelineFrame = null;

    // Quyền tua timeline: chỉ Admin mới được kéo. Server cấp lock tạm thời
    // cho đúng một Admin; sau khi nhả, tất cả Admin khác phải chờ thêm 500ms.
    let timelineSeekLock = { active: false, socketId: null, until: 0, token: 0 };
    let timelineSeekOwner = false;
    let timelineSeekDragging = false;
    let timelineSeekCommitBusy = false;

    function flushYouTubeApiCallbacks() {
      youtubeApiReady = true;
      console.log('🎬 YouTube IFrame API đã sẵn sàng');

      const callbacks = youtubeApiReadyCallbacks.splice(0);
      callbacks.forEach(callback => {
        try {
          callback();
        } catch (error) {
          console.error('❌ Lỗi YouTube API callback:', error);
        }
      });
    }

    // YouTube API có thể tải rất nhanh trước khi callback được gán.
    // Vì vậy luôn kiểm tra window.YT ở nhiều thời điểm.
    window.onYouTubeIframeAPIReady = flushYouTubeApiCallbacks;

    // ==================== AUTO PLAY ====================
    // 0 = Tắt
    // 1 = Tuần tự
    // 2 = Ngẫu nhiên

    let autoPlayMode = 0;
    let autoPlayController = false;
    let autoPlayControllerSocketId = null;

    // Chống gọi bài tiếp theo 2 lần khi YouTube
    // gửi nhiều trạng thái ENDED.
    let autoPlayNextBusy = false;

    const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];

    // Xử lý Retina display cho Canvas sắc nét hơn
    const dpr = window.devicePixelRatio || 2;
    canvas.width = 300 * dpr;
    canvas.height = 300 * dpr;
    ctx.scale(dpr, dpr);

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      return (match && match[1]) ? match[1] : null;
    }

    function updateOnlineSummary(summary = {}) {
      const count = Number(summary.users) || 0;
      if (onlineUserCount) {
        onlineUserCount.textContent = String(count);
      }
    }

    function renderOnlineDetails(payload = {}) {
      if (!window.isAdmin) return;

      const users = Array.isArray(payload.users) ? payload.users : [];
      const summary = payload.summary || {};
      const connections = Number(summary.connections) || 0;
      const devices = summary.devices || {};

      if (onlineUserList) {
        if (users.length === 0) {
          onlineUserList.innerHTML = '<div class="online-empty">Không có user nào đang online.</div>';
        } else {
          onlineUserList.innerHTML = users.map(user => {
            const name = escapeHtml(user.name || 'Người dùng');
            const connectionCount = Number(user.connections) || 0;
            return `<span class="online-user-chip" title="${name}">${name}${connectionCount > 1 ? ` · ${connectionCount} connections` : ''}</span>`;
          }).join('');
        }
      }

      if (onlineConnectionDetails) {
        onlineConnectionDetails.innerHTML = `
          📱 Connections: <strong>${connections}</strong><br>
          ├── 📱 Điện thoại: <strong>${Number(devices.phone) || 0}</strong><br>
          ├── 💻 Máy tính: <strong>${Number(devices.computer) || 0}</strong><br>
          └── 📲 Tablet: <strong>${Number(devices.tablet) || 0}</strong>
        `;
      }
    }

    function requestOnlineDetails() {
      if (!window.isAdmin || !socket.connected) return;
      socket.emit('requestOnlineDetails');
    }

    onlineDetailsToggle?.addEventListener('click', () => {
      if (!window.isAdmin) return;

      const open = onlineDetails?.classList.toggle('open') === true;
      onlineDetailsToggle.setAttribute('aria-expanded', String(open));

      if (onlineToggleIcon) {
        onlineToggleIcon.textContent = open ? '▲' : '▼';
      }

      if (open) {
        requestOnlineDetails();
      }
    });

    socket.on('onlineUsers', (summary) => {
      updateOnlineSummary(summary);

      // Nếu Admin đang mở bảng chi tiết, cập nhật ngay khi có người
      // vào/ra hoặc đổi số connection.
      if (window.isAdmin && onlineDetails?.classList.contains('open')) {
        requestOnlineDetails();
      }
    });

    socket.on('onlineDetails', (payload) => {
      renderOnlineDetails(payload);
    });

    // Quản lý trạng thái socket
    socket.on('connect', () => {
      console.log('🔌 Socket connected:', socket.id);
      console.log('🔑 Sending Telegram initData, length:', telegramInitData.length);

      socket.emit('authenticate', {
        initData: telegramInitData,
        deviceInfo
      });
    });

    socket.on('connect_error', (error) => {
      console.error('❌ Socket connection error:', error);
    });

    socket.on('disconnect', () => {
      statusBadge.textContent = '🔴 Mất kết nối';
      statusBadge.className = 'status-badge offline';
    });

    // Cập nhật phân quyền từ Backend
    socket.on('adminStatus', (data) => {
      console.log('👮 ADMIN STATUS:', data);

      // Lưu trạng thái Admin để updateUI() biết có hiện nút Xóa hay không
      window.isAdmin = data.isAdmin === true;
      // Giữ cả biến cục bộ và window.isAdmin đồng nhất.
      // Các hàm điều khiển playback dùng biến cục bộ isAdmin.
      isAdmin = window.isAdmin;

      if (onlineDetailsToggle) {
        onlineDetailsToggle.classList.toggle('admin-only', !window.isAdmin);
      }
      if (onlineDetails) {
        onlineDetails.classList.toggle('admin-only', !window.isAdmin);
        if (!window.isAdmin) {
          onlineDetails.classList.remove('open');
          onlineDetailsToggle?.setAttribute('aria-expanded', 'false');
          if (onlineToggleIcon) onlineToggleIcon.textContent = '▼';
        }
      }
      if (window.isAdmin && onlineDetails?.classList.contains('open')) {
        requestOnlineDetails();
      }

      // Đồng bộ lại quyền Controller sau khi trạng thái Admin được xác thực.
      // Điều này tránh trường hợp event autoPlayMode đến trước adminStatus.
      autoPlayController = window.isAdmin &&
        autoPlayControllerSocketId === socket.id;
      updateAutoPlayButton();
      updatePlaybackToggle();

      if (window.isAdmin) {
        btnSpin.classList.remove('admin-only');
        adminPanel.classList.remove('admin-only');
      } else {
        btnSpin.classList.add('admin-only');
        adminPanel.classList.add('admin-only');
      }

      // Cập nhật lại danh sách để nút Xóa xuất hiện/biến mất
      updateUI();

      // Xin snapshot authoritative lần nữa sau khi Telegram auth hoàn tất.
      if (data.authenticated === true) {
        socket.emit('requestPlaybackState');
      }
    });

    socket.on('stateUpdate', (data) => {
      isFormOpen = data.isFormOpen;
      songs = data.songs || [];
      currentAction = data.lastAction || null;
      currentLikeCount = Number(data.likes) || 0;
      currentDislikeCount = Number(data.dislikes) || 0;
      replacementCountdown = Number.isFinite(Number(data.replacementCountdown)) ? Number(data.replacementCountdown) : null;
      updateOnlineSummary(data.online || {});
      updateHealth(typeof data.health === 'number' ? data.health : 5);
      if (data.playback) {
        applyPlaybackState(data.playback, { fromState: true });
      }
      if (data.playbackSeekLock) {
        applyTimelineSeekLock(data.playbackSeekLock);
      }

      if (data.songAction) {
        updateSongActionLock(data.songAction);
      }

      if (typeof data.autoPlayMode !== 'undefined') {
        autoPlayMode = Number(data.autoPlayMode) || 0;
        autoPlayControllerSocketId = data.controllerSocketId || null;
        autoPlayController = window.isAdmin === true &&
          autoPlayControllerSocketId === socket.id;
        autoPlayNextBusy = false;
        if (btnAutoPlay) btnAutoPlay.disabled = false;
        updateAutoPlayButton();
      }

      updateUI();

      if (data.lastWinner && !isSpinning && currentPlayingUrl !== data.lastWinner.url) {
        renderPlayer(data.lastWinner, false);
      } else if (!data.lastWinner && !isSpinning) {
        clearPlayer();
      }
    });

    // ==================== SONG PLAYED ====================
    // Nhận yêu cầu phát bài hát từ một Mini App khác.
    // Client nhận sự kiện sẽ phát ở chế độ MUTE.
    socket.on('songPlayed', (data) => {
      if (!data?.song) return;

      const incomingActionVersion = Number(data.actionVersion) || 0;
      if (incomingActionVersion && incomingActionVersion < latestSongActionVersion) {
        console.log('⏭️ Bỏ qua songPlayed cũ:', incomingActionVersion, 'latest=', latestSongActionVersion);
        return;
      }
      if (incomingActionVersion) latestSongActionVersion = incomingActionVersion;

      const song = data.song;
      currentAction = data.action || null;
      currentLikeCount = Number(data.likes) || 0;
      currentDislikeCount = Number(data.dislikes) || 0;
      replacementCountdown = Number.isFinite(Number(data.replacementCountdown)) ? Number(data.replacementCountdown) : null;
      updateHealth(typeof data.health === 'number' ? data.health : 5);
      currentVote = 0;
      updateVoteButtons();

      const shouldPlaySound =
        data.initiatorSocketId === socket.id;

      if (data.playback) {
        currentPlayback = normalizePlaybackState(data.playback);
      }

      console.log(
        shouldPlaySound
          ? '▶️ Bạn là người phát — có tiếng'
          : '▶️ Client khác phát — mute',
        song
      );

      renderPlayer(song, shouldPlaySound, currentAction, currentPlayback);
    });

    socket.on('autoPlayMode', (data) => {
      if (!data) return;

      autoPlayMode = Number(data.mode) || 0;
      autoPlayControllerSocketId = data.controllerSocketId || null;
      autoPlayController = window.isAdmin === true &&
        autoPlayControllerSocketId === socket.id;
      autoPlayNextBusy = false;
      if (btnAutoPlay) btnAutoPlay.disabled = false;

      updateAutoPlayButton();

      console.log(
        '🎵 Nhận Auto Play Mode:',
        autoPlayMode,
        '| controller:',
        autoPlayControllerSocketId
      );
    });

    socket.on('triggerSpin', (data) => {
      const incomingActionVersion = Number(data?.actionVersion) || 0;
      if (incomingActionVersion && incomingActionVersion < latestSongActionVersion) {
        console.log('⏭️ Bỏ qua triggerSpin cũ:', incomingActionVersion, 'latest=', latestSongActionVersion);
        return;
      }
      if (incomingActionVersion) latestSongActionVersion = incomingActionVersion;

      const shouldPlaySound = data?.initiatorSocketId === socket.id;
      currentAction = data?.action || null;
      startSpinAnimation(data.selectedIndex, data.winner, shouldPlaySound, data?.action || null);
    });

    socket.on('songActionLock', (payload) => {
      updateSongActionLock(payload || {});
    });

    function updateSongActionLock(payload = {}) {
      const version = Number(payload.version) || 0;
      if (version < latestSongActionVersion) return;

      latestSongActionVersion = Math.max(latestSongActionVersion, version);
      songActionLock = {
        active: payload.active === true,
        type: payload.type || null,
        until: Number(payload.until) || 0,
        version
      };

      updateUI();
    }

    function updateUI() {
      if (isFormOpen) {
        statusBadge.textContent = '🟢 Đang mở form';
        statusBadge.className = 'status-badge';
        btnSubmit.disabled = false;
        btnToggleForm.textContent = '🔒 Đóng Form';
      } else {
        statusBadge.textContent = '🔴 Đã đóng form';
        statusBadge.className = 'status-badge closed';
        btnSubmit.disabled = true;
        btnToggleForm.textContent = '🔓 Mở Form';
      }

      // Đảm bảo songs luôn là mảng
      if (!Array.isArray(songs)) {
        console.warn('⚠️ songs không phải mảng:', songs);
        songs = [];
      }

      btnSpin.disabled = isSpinning || songs.length === 0 || songActionLock.active;

      listTitleEl.textContent = `📋 Danh sách bài hát (${songs.length})`;

      if (songs.length === 0) {
        songListEl.innerHTML = `
          <div style="
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 10px;
          ">
            Chưa có bài hát nào được gửi.
          </div>
        `;
      } else {
        try {
          songListEl.innerHTML = songs.map((s, idx) => {
            // Bảo vệ trường hợp dữ liệu bài hát bị thiếu
            s = s || {};

            const user = escapeHtml(
              s.user || 'Người dùng'
            );

            const title = escapeHtml(
              s.title || 'Đang cập nhật tiêu đề...'
            );
            const id = String(s.id ?? '');

            return `
              <div class="song-item">

                <div class="song-header">

                  <div class="song-user">
                    #${idx + 1} - ${user}
                  </div>

                  <button
                    class="btn-play-song"
                    ${songActionLock.active ? 'disabled' : ''}
                    onclick="playSong('${id}')"
                    title="Phát bài hát"
                  >
                    ▶
                  </button>

                </div>

                <div class="song-title-row">

                  <div class="song-title">
                    ${title}
                  </div>

                  <!-- DELETE: CHỈ ADMIN -->
                  <button
                    class="btn-delete-song ${window.isAdmin ? '' : 'admin-only'}"
                    onclick="deleteSong('${id}')"
                    title="Xóa bài hát"
                  >
                    ✖
                  </button>

                </div>

              </div>
            `;
          }).join('');

        } catch (error) {
          console.error('❌ Lỗi render danh sách bài hát:', error);
          console.error('📦 songs hiện tại:', songs);

          songListEl.innerHTML = `
            <div style="
              text-align: center;
              color: #ff6b6b;
              font-size: 13px;
              padding: 10px;
            ">
              ⚠️ Lỗi hiển thị danh sách bài hát.
            </div>
          `;
        }
      }

      drawWheel();
    }


    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    
    async function playSong(songId) {
      if (songActionLock.active) {
        console.log('⏳ Không thể Play: đang có thao tác', songActionLock.type);
        return;
      }

      if (!songId) {
        alert('Không xác định được bài hát cần phát!');
        return;
      }

      const song = songs.find(
        s => String(s.id) === String(songId)
      );

      if (!song) {
        alert('Không tìm thấy bài hát!');
        return;
      }

      try {
        const res = await fetch('/api/play-song', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
          id: songId,
          initData: telegramInitData,
          socketId: socket.id
        })
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.message || 'Không thể phát bài hát!');
          return;
        }

        // QUAN TRỌNG:
        // Chính người bấm PLAY sẽ phát có âm thanh.

      } catch (error) {
        console.error('❌ Lỗi phát bài hát:', error);
        alert('Lỗi kết nối đến server!');
      }
    }
    async function deleteSong(songId) {
      if (!window.isAdmin) {
        alert('Bạn không có quyền Admin!');
        return;
      }

      if (!songId) {
        alert('Không xác định được bài hát cần xóa!');
        return;
      }

      const song = songs.find(
        s => String(s.id) === String(songId)
      );

      if (!song) {
        alert('Không tìm thấy bài hát!');
        return;
      }

      const confirmed = confirm(
        `Bạn có chắc muốn xóa bài hát này?\n\n${song.user}\n${song.title || song.url}`
      );

      if (!confirmed) return;

      try {
        const res = await fetch('/api/delete-song', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            id: songId,
            initData: telegramInitData
          })
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.message || 'Không thể xóa bài hát!');
          return;
        }

        // Server sẽ broadcast stateUpdate mới
        // Không cần tự sửa mảng songs ở đây.

      } catch (error) {
        console.error('❌ Lỗi xóa bài hát:', error);
        alert('Lỗi kết nối đến server!');
      }
    }

    function drawWheel() {
      const numSlices = songs.length;
      ctx.clearRect(0, 0, 300, 300);

      if (numSlices === 0) {
        ctx.beginPath();
        ctx.arc(150, 150, 140, 0, 2 * Math.PI);
        ctx.fillStyle = '#2b384e';
        ctx.fill();
        ctx.fillStyle = '#888';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Thêm bài hát để quay', 150, 155);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;
      for (let i = 0; i < numSlices; i++) {
        const start = currentAngle + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 140, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#1c2333';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(150, 150);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';

        let label = songs[i].user || `Bài ${i+1}`;
        if (label.length > 16) label = label.substring(0, 14) + '...';

        let fontSize = 12;
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(label, 134, fontSize / 3);
        ctx.restore();
      }
    }

    function whenYouTubeApiReady(callback) {
      if (youtubeApiReady) {
        callback();
      } else {
        youtubeApiReadyCallbacks.push(callback);
      }
    }

    // ==================== YOUTUBE PLAYER API ====================
    let pendingPlayerSong = null;
    let pendingPlayerSound = false;
    let youtubePlayerReady = false;

    function initYouTubePlayer() {
      if (youtubeApiPlayer) return;
      if (!window.YT || !window.YT.Player) return;

      youtubeApiReady = true;
      youtubeApiPlayer = new YT.Player('ytPlayer', {
        playerVars: {
          autoplay: 0,
          controls: 1,
          disablekb: 0,
          rel: 0,
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (event) => {
            youtubePlayerReady = true;
            console.log('🎬 YouTube Player đã sẵn sàng');
            updateAudioControls();

            if (pendingPlayerSong) {
              const song = pendingPlayerSong;
              const sound = pendingPlayerSound;
              pendingPlayerSong = null;
              pendingPlayerSound = false;
              loadSongIntoPlayer(song, sound, pendingPlayback);
              pendingPlayback = null;
            }
          },
          onStateChange: onYouTubePlayerStateChange,
          onError: (event) => {
            console.warn('⚠️ YouTube Player error:', event.data);
          }
        }
      });
    }

    // API có thể đã tải trước khi callback được đăng ký.
    function ensureYouTubePlayerReady() {
      if (window.YT && window.YT.Player) {
        if (!youtubeApiReady) flushYouTubeApiCallbacks();
        initYouTubePlayer();
        return true;
      }
      return false;
    }

    ensureYouTubePlayerReady();
    whenYouTubeApiReady(initYouTubePlayer);

    window.addEventListener('load', () => {
      ensureYouTubePlayerReady();
    });

    const youtubeReadyPoll = setInterval(() => {
      if (ensureYouTubePlayerReady()) {
        clearInterval(youtubeReadyPoll);
      }
    }, 100);

    // ==================== CÁ NHÂN HÓA ÂM THANH ====================
    // null = chưa từng chọn, true = luôn bật, false = luôn mute.
    // Volume được lưu trên thiết bị/trình duyệt của từng user.
    let savedAudioPreference = null;
    let savedVolume = 70;

    try {
      const storedPreference = localStorage.getItem(MUSIC_PREF_KEY);
      if (storedPreference === 'true') savedAudioPreference = true;
      if (storedPreference === 'false') savedAudioPreference = false;
      const storedVolume = Number(localStorage.getItem(VOLUME_PREF_KEY));
      if (Number.isFinite(storedVolume)) {
        savedVolume = Math.max(0, Math.min(100, storedVolume));
      }
    } catch (error) {
      console.warn('⚠️ Không đọc được thiết lập âm thanh:', error);
    }

    function saveAudioPreference(value) {
      savedAudioPreference = value;
      try {
        localStorage.setItem(MUSIC_PREF_KEY, String(value));
      } catch (error) {}
      updateAudioControls();
    }

    function saveVolume(value) {
      savedVolume = Math.max(0, Math.min(100, Number(value) || 0));
      try {
        localStorage.setItem(VOLUME_PREF_KEY, String(savedVolume));
      } catch (error) {}
      updateAudioControls();
    }

    function sendYouTubeCommand(func, args = []) {
      if (!youtubeApiPlayer || !youtubePlayerReady) return;

      try {
        if (func === 'setVolume') {
          youtubeApiPlayer.setVolume(Number(args[0]) || 0);
        } else if (func === 'mute') {
          youtubeApiPlayer.mute();
        } else if (func === 'unMute') {
          youtubeApiPlayer.unMute();
        } else if (func === 'playVideo') {
          youtubeApiPlayer.playVideo();
        } else if (func === 'pauseVideo') {
          youtubeApiPlayer.pauseVideo();
        } else if (func === 'seekTo') {
          youtubeApiPlayer.seekTo(Number(args[0]) || 0, args[1] !== false);
        } else if (func === 'stopVideo') {
          youtubeApiPlayer.stopVideo();
        }
      } catch (error) {
        console.warn(`⚠️ Không gửi được lệnh YouTube ${func}:`, error);
      }
    }

    function updateAudioControls() {
      const muted = savedAudioPreference === false || savedVolume === 0;
      btnAudioToggle.textContent = muted ? '🔇' : '🔊';
      btnAudioToggle.setAttribute('aria-label', muted ? 'Bật nhạc' : 'Tắt nhạc');
      btnAudioToggle.classList.toggle('enabled', !muted);
      volumeIcon.textContent = muted
        ? '🔇'
        : (savedVolume < 50 ? '🔉' : '🔊');
      volumeSlider.value = String(savedVolume);
      volumeValue.textContent = savedVolume;
    }

    function applyAudioSettings(playAfterUnmute = false) {
      if (!youtubeApiPlayer || !youtubePlayerReady) return;

      youtubeApiPlayer.setVolume(savedVolume);

      if (savedAudioPreference === false || savedVolume === 0) {
        youtubeApiPlayer.mute();
      } else {
        youtubeApiPlayer.unMute();
        if (playAfterUnmute && currentPlayback.status === 'playing') {
          youtubeApiPlayer.playVideo();
        }
      }

      updateAudioControls();
    }

    btnAudioToggle.addEventListener('click', () => {
      const muted = savedAudioPreference === false || savedVolume === 0;

      if (muted) {
        if (savedVolume === 0) saveVolume(70);
        saveAudioPreference(true);
        applyAudioSettings(true);
        audioNotice.textContent = '🔊 Âm thanh: Đang Bật';
        audioNotice.className = 'audio-notice unmuted';
      } else {
        saveAudioPreference(false);
        applyAudioSettings(false);
        audioNotice.textContent = '🔇 Âm thanh: Đã Tắt';
        audioNotice.className = 'audio-notice muted';
      }
    });

    volumeSlider.addEventListener('input', () => {
      const value = Number(volumeSlider.value);
      saveVolume(value);

      if (value === 0) {
        saveAudioPreference(false);
        sendYouTubeCommand('mute');
      } else {
        saveAudioPreference(true);
        sendYouTubeCommand('setVolume', [value]);
        sendYouTubeCommand('unMute');
      }

      updateAudioControls();
    });

    updateAudioControls();

    function getEffectiveSound(shouldPlaySound) {
      // Chỉ thiết bị vừa thực hiện hành động Play/Spin mới được tự động
      // phát có tiếng. Client vào sau/reload luôn bắt đầu mute để tránh
      // autoplay có tiếng bị WebView/YouTube chặn. Người dùng vẫn có thể
      // tự bật âm thanh bằng nút loa.
      if (shouldPlaySound !== true) return false;
      return savedAudioPreference === false ? false : true;
    }

    function updateAudioNotice(effectiveSound) {
      if (effectiveSound) {
        audioNotice.textContent = '🔊 Âm thanh: Đang Bật';
        audioNotice.className = 'audio-notice unmuted';
      } else {
        audioNotice.textContent = savedAudioPreference === false
          ? '🔇 Âm thanh: Đã Tắt'
          : '🔇 Âm thanh: Tắt (Bấm "Bật nhạc" để nghe)';
        audioNotice.className = 'audio-notice muted';
      }
    }

    function loadSongIntoPlayer(song, shouldPlaySound, playback = currentPlayback) {
      const videoId = extractYouTubeId(song.url);
      if (!videoId) return;

      if (!youtubeApiPlayer || !youtubePlayerReady) {
        pendingPlayerSong = song;
        pendingPlayerSound = shouldPlaySound;
        pendingPlayback = playback || null;
        return;
      }

      const effectiveSound = getEffectiveSound(shouldPlaySound);
      const playbackState = normalizePlaybackState(playback || currentPlayback);
      const loadToken = ++playerLoadToken;

      youtubeApiPlayer.setVolume(savedVolume);
      if (effectiveSound && savedVolume > 0) youtubeApiPlayer.unMute();
      else youtubeApiPlayer.mute();

      currentPlayback = playbackState;
      const targetPosition = getPlaybackTargetPosition(playbackState);
      const shouldStartPaused = playbackState.status === 'paused';
      const scheduledStart = playbackState.status === 'playing' && Number(playbackState.startAt) > Date.now();

      const seekAuthoritative = () => {
        if (loadToken !== playerLoadToken) return;
        if (!isSamePlaybackSong(playbackState.songId)) return;
        if (timelineSeekDragging) return;
        try {
          youtubeApiPlayer.seekTo(getPlaybackTargetPosition(currentPlayback), true);
        } catch (error) {
          console.warn('⚠️ Chưa thể seek YouTube:', error);
        }
      };

      if (scheduledStart) {
        youtubeApiPlayer.cueVideoById(videoId, targetPosition);
        const delay = Math.max(0, Number(playbackState.startAt) - Date.now());
        window.setTimeout(() => {
          if (loadToken !== playerLoadToken || !isSamePlaybackSong(playbackState.songId)) return;
          seekAuthoritative();
          sendYouTubeCommand('playVideo');
        }, delay);
      } else if (shouldStartPaused) {
        // Nếu trạng thái authoritative đang Pause, chỉ cue video; không
        // cho YouTube tự phát rồi mới pause vì điều đó dễ gây race với
        // trạng thái playback và autoplay policy của WebView.
        youtubeApiPlayer.cueVideoById(videoId, targetPosition);
      } else {
        youtubeApiPlayer.loadVideoById(videoId, targetPosition);

        // startSeconds đôi khi bị YouTube bỏ qua lúc iframe vừa reload.
        // Seek lại vài lần sau khi player đã có media để bảo đảm vào đúng mốc.
        [100, 500, 1200].forEach((delay) => {
          window.setTimeout(() => {
            if (loadToken !== playerLoadToken || !isSamePlaybackSong(playbackState.songId)) return;
            seekAuthoritative();
          }, delay);
        });

        window.setTimeout(() => {
          if (loadToken !== playerLoadToken || !isSamePlaybackSong(playbackState.songId)) return;
          youtubeApiPlayer.playVideo();
        }, 150);
      }

      updateAudioNotice(effectiveSound && savedVolume > 0);
      updateAudioControls();
      updatePlaybackToggle();
    }

    function clearPlayer() {
      pendingPlayerSong = null;
      pendingPlayerSound = false;
      currentPlayingUrl = null;
      currentPlayback = normalizePlaybackState({ songId: null, status: 'stopped', position: 0, version: currentPlayback.version + 1 });
      pendingPlayback = null;
      updatePlaybackToggle();

      if (youtubeApiPlayer && youtubePlayerReady) {
        try {
          youtubeApiPlayer.stopVideo();
          youtubeApiPlayer.clearVideo();
        } catch (error) {
          console.warn('⚠️ Không thể dừng YouTube Player:', error);
        }
      }

      playerCard.style.display = 'none';
      currentAction = null;
      currentHealth = 5;
      currentLikeCount = 0;
      currentDislikeCount = 0;
      replacementCountdown = null;
      currentVote = 0;
      updateHealth(5);
      updateVoteButtons();
      if (winnerAction) winnerAction.textContent = '';
    }

    function updateHealth(health, likes = currentLikeCount, dislikes = currentDislikeCount, countdown = replacementCountdown) {
      currentHealth = Math.max(0, Math.min(5, Number(health) || 0));
      currentLikeCount = Math.max(0, Number(likes) || 0);
      currentDislikeCount = Math.max(0, Number(dislikes) || 0);
      replacementCountdown = Number.isFinite(Number(countdown)) ? Number(countdown) : null;

      if (healthBar) {
        const segments = healthBar.querySelectorAll('.health-segment');
        segments.forEach((segment, index) => {
          segment.classList.toggle('active', index < currentHealth);
        });
        healthBar.setAttribute(
          'aria-label',
          `Thanh máu ${currentHealth} trên 5`
        );
      }

      if (likeCount) likeCount.textContent = String(currentLikeCount);
      if (dislikeCount) dislikeCount.textContent = String(currentDislikeCount);

      if (healthStatus) {
        if (currentHealth >= 2) {
          healthStatus.innerHTML = '❤️ Bạn có yêu thích bài hát này?';
        } else if (currentHealth === 1) {
          healthStatus.innerHTML = '💔 Hình như không hợp thị hiếu';
        } else {
          const seconds = Math.max(0, Math.min(10, Number(replacementCountdown) || 0));
          healthStatus.innerHTML = `⚠️ Bài hát sẽ được thay thế trong <span class="health-status-countdown">${seconds}</span>`;
        }
      }

      updateVoteButtons();
    }

    function updateVoteButtons() {
      const hasSong = !!currentPlayingUrl;
      if (btnLike) {
        btnLike.disabled = !hasSong;
        btnLike.classList.toggle('active', currentVote === 1);
      }
      if (btnDislike) {
        btnDislike.disabled = !hasSong;
        btnDislike.classList.toggle('active', currentVote === -1);
      }
    }

    socket.on('songHealth', (data) => {
      if (!data) return;

      const songId = lastWinnerId();
      if (data.songId != null && songId != null && String(data.songId) !== String(songId)) {
        return;
      }

      updateHealth(
        typeof data.health === 'number' ? data.health : currentHealth,
        data.likes,
        data.dislikes,
        data.replacementCountdown
      );

      if (
        data.telegramId != null &&
        userData.id != null &&
        String(data.telegramId) === String(userData.id)
      ) {
        currentVote = Number(data.userVote) || 0;
        updateVoteButtons();
      }
    });

    socket.on('replacementCountdown', (data) => {
      if (!data) return;

      const songId = lastWinnerId();
      if (data.songId != null && songId != null && String(data.songId) !== String(songId)) {
        return;
      }

      replacementCountdown = Number.isFinite(Number(data.countdown))
        ? Number(data.countdown)
        : null;

      updateHealth(currentHealth, currentLikeCount, currentDislikeCount, replacementCountdown);
    });

    function lastWinnerId() {
      if (!currentPlayingUrl) return null;
      const currentSong = songs.find(song => song.url === currentPlayingUrl);
      return currentSong?.id ?? null;
    }

    async function sendVote(vote) {
      if (!currentPlayingUrl) return;

      btnLike.disabled = true;
      btnDislike.disabled = true;

      try {
        const res = await fetch('/api/song-vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            vote,
            initData: telegramInitData
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success && !data.replaced) {
          if (data.message) console.log('❤️ Vote:', data.message);
          return;
        }

        if (data.replaced) {
          // songPlayed/stateUpdate sẽ cập nhật bài mới + dòng "Thay thế".
          currentVote = 0;
          updateVoteButtons();
        } else {
          currentVote = Number(data.userVote) || 0;
          updateHealth(data.health, data.likes, data.dislikes, data.replacementCountdown);
        }
      } catch (error) {
        console.error('❌ Lỗi Like/Dislike:', error);
      } finally {
        updateVoteButtons();
      }
    }

    btnLike?.addEventListener('click', () => sendVote(1));
    btnDislike?.addEventListener('click', () => sendVote(-1));

    function renderPlayer(winner, shouldPlaySound, action = currentAction, playback = currentPlayback) {
      if (!winner?.url) return;

      const videoId = extractYouTubeId(winner.url);
      if (!videoId) return;

      currentPlayingUrl = winner.url;
      currentAction = action || null;
      winnerUser.textContent = winner.user || 'Người dùng';
      playerTitleText.textContent = winner.title || '-';
      if (winnerAction) {
        if (currentAction?.type === 'spin' && currentAction.user) {
          winnerAction.innerHTML =
            ` - <span class="action-label">Quay bởi:</span> ` +
            `<strong class="action-user">${escapeHtml(currentAction.user)}</strong>`;

        } else if (currentAction?.type === 'play' && currentAction.user) {
          winnerAction.innerHTML =
            ` - <span class="action-label">Play bởi:</span> ` +
            `<strong class="action-user">${escapeHtml(currentAction.user)}</strong>`;

        } else if (currentAction?.type === 'replace' && currentAction.title) {
          winnerAction.innerHTML =
            ` - <span class="action-label">Thay thế:</span> ` +
            `<strong class="action-user">${escapeHtml(currentAction.title)}</strong>`;

        } else {
          winnerAction.innerHTML = '';
        }
      }
      playerCard.style.display = 'block';

      // renderPlayer() cũng được gọi sau khi Spin kết thúc.
      // clearPlayer() trước đó đã disable Like/Dislike vì chưa có bài,
      // nên phải cập nhật lại trạng thái nút ngay khi bài mới được gán.
      updateVoteButtons();

      const effectiveSound = getEffectiveSound(shouldPlaySound);
      updateAudioNotice(effectiveSound && savedVolume > 0);
      updateAudioControls();

      loadSongIntoPlayer(winner, shouldPlaySound, playback);
    }

    function normalizePlaybackState(state = {}) {
      return {
        songId: state.songId != null ? String(state.songId) : null,
        status: ['playing', 'paused', 'stopped', 'scheduled'].includes(state.status) ? state.status : 'stopped',
        position: Math.max(0, Number(state.position) || 0),
        serverTime: Number(state.serverTime) || Date.now(),
        version: Number(state.version) || 0,
        authoritySocketId: state.authoritySocketId || null,
        startAt: Number.isFinite(Number(state.startAt)) ? Number(state.startAt) : null,
        controlLockUntil: Number(state.controlLockUntil) || 0
      };
    }

    function isSamePlaybackSong(songId) {
      if (songId == null) return false;
      const currentSong = songs.find(song => String(song.id) === String(songId));
      return !!currentSong && currentPlayingUrl === currentSong.url;
    }

    function getPlaybackTargetPosition(state = currentPlayback) {
      const normalized = normalizePlaybackState(state);
      let position = normalized.position;
      if (normalized.status === 'playing') {
        const now = Date.now();
        if (normalized.startAt) {
          if (now >= normalized.startAt) {
            position += Math.max(0, now - normalized.startAt) / 1000;
          }
        } else {
          position += Math.max(0, now - normalized.serverTime) / 1000;
        }
      }
      return Math.max(0, position);
    }

    function eventStateIsPlaying() {
      return typeof YT !== 'undefined' && youtubeApiPlayer &&
        youtubeApiPlayer.getPlayerState?.() === YT.PlayerState.PLAYING;
    }

    function eventStateIsPaused() {
      return typeof YT !== 'undefined' && youtubeApiPlayer &&
        youtubeApiPlayer.getPlayerState?.() === YT.PlayerState.PAUSED;
    }

    function applyPlaybackState(state, options = {}) {
      const next = normalizePlaybackState(state);
      currentPlayback = next;
      updatePlaybackToggle();

      if (!youtubeApiPlayer || !youtubePlayerReady || !currentPlayingUrl || !next.songId) {
        return;
      }

      if (!isSamePlaybackSong(next.songId)) return;

      const target = getPlaybackTargetPosition(next);
      try {
        const local = Number(youtubeApiPlayer.getCurrentTime?.() || 0);
        const drift = Math.abs(local - target);
        const isLocalAuthority = next.authoritySocketId === socket.id;

        // Không tự tua liên tục trên chính authority. Server đã nhận vị trí
        // thực tế từ authority; các client khác chỉ hiệu chỉnh khi lệch rõ rệt.
        if (!timelineSeekDragging && (options.forceSeek === true || (!isLocalAuthority && drift > 2.5))) {
          youtubeApiPlayer.seekTo(target, true);
        }

        if (next.status === 'paused') {
          if (eventStateIsPlaying()) youtubeApiPlayer.pauseVideo();
        } else if (next.status === 'playing') {
          if (eventStateIsPaused()) youtubeApiPlayer.playVideo();
        }
      } catch (error) {
        console.warn('⚠️ Không thể đồng bộ timeline:', error);
      }
    }

    function formatPlaybackTime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours > 0) {
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updatePlaybackTimeline() {
      if (!playbackTimeline || !playbackTime) return;

      let duration = 0;
      let position = timelineSeekDragging
        ? Number(playbackTimeline.value) || 0
        : getPlaybackTargetPosition(currentPlayback);

      try {
        if (youtubeApiPlayer && youtubePlayerReady) {
          duration = Number(youtubeApiPlayer.getDuration?.() || 0);
          const localPosition = Number(youtubeApiPlayer.getCurrentTime?.() || 0);

          // Dùng thời gian thực của YouTube để thanh chạy mượt.
          // Khi player chưa sẵn sàng, dùng vị trí authoritative từ server.
          if (!timelineSeekDragging && (currentPlayback.status === 'playing' || currentPlayback.status === 'paused')) {
            position = Math.max(0, localPosition);
          }
        }
      } catch (error) {
        // Giữ position từ server nếu YouTube chưa trả được thời gian.
      }

      if (duration > 0) {
        playbackTimeline.max = String(duration);
        position = Math.min(position, duration);
      } else {
        playbackTimeline.max = '0';
        position = 0;
      }

      if (!timelineSeekDragging) {
        playbackTimeline.value = String(position);
      }
      playbackTime.textContent = `${formatPlaybackTime(position)} / ${formatPlaybackTime(duration)}`;
    }

    function startPlaybackTimelineLoop() {
      if (playbackTimelineFrame) return;

      const tick = () => {
        updatePlaybackTimeline();
        playbackTimelineFrame = window.requestAnimationFrame(tick);
      };

      playbackTimelineFrame = window.requestAnimationFrame(tick);
    }

    startPlaybackTimelineLoop();

    function updateTimelineSeekUI() {
      if (!playbackTimeline) return;

      const now = Date.now();
      const locked = timelineSeekLock.active && timelineSeekLock.until > now;
      const canSeek = isAdmin && !!currentPlayingUrl && !songActionLock.active && !isSpinning;
      const owner = canSeek && timelineSeekOwner && timelineSeekLock.socketId === socket.id;

      playbackTimeline.disabled = !canSeek || (locked && !owner);
      playbackTimeline.classList.toggle('admin-seek-enabled', canSeek && (!locked || owner));
      playbackTimeline.classList.toggle('seek-locked', locked && !owner);
      playbackTimeline.title = !isAdmin
        ? 'Chỉ Admin được tua'
        : (locked && !owner
          ? 'Admin khác đang tua — vui lòng chờ'
          : (canSeek ? 'Kéo để tua video' : 'Chưa thể tua')) ;
    }

    function applyTimelineSeekLock(payload = {}) {
      const token = Number(payload.token) || 0;
      if (token < Number(timelineSeekLock.token || 0)) return;

      timelineSeekLock = {
        active: payload.active === true,
        socketId: payload.socketId || null,
        until: Number(payload.until) || 0,
        token
      };

      if (timelineSeekLock.socketId !== socket.id) {
        timelineSeekOwner = false;
        if (timelineSeekDragging) timelineSeekDragging = false;
      }

      updateTimelineSeekUI();
      if (timelineSeekLock.active && timelineSeekLock.until > Date.now()) {
        window.setTimeout(() => {
          if (Date.now() >= timelineSeekLock.until) {
            timelineSeekLock.active = false;
            timelineSeekLock.socketId = null;
            updateTimelineSeekUI();
          }
        }, Math.max(0, timelineSeekLock.until - Date.now()) + 10);
      }
    }

    async function claimTimelineSeekLock() {
      if (!isAdmin || !currentPlayingUrl || !socket.connected) return false;

      try {
        const res = await fetch('/api/playback-seek-lock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'acquire',
            initData: telegramInitData,
            socketId: socket.id,
            expectedSongId: lastWinnerId()
          })
        });
        const data = await res.json();
        if (data.lock) applyTimelineSeekLock(data.lock);
        if (!data.success) return false;
        timelineSeekOwner = true;
        updateTimelineSeekUI();
        return true;
      } catch (error) {
        console.error('❌ Không thể chiếm quyền tua timeline:', error);
        return false;
      }
    }

    async function commitTimelineSeek(position) {
      if (!timelineSeekOwner || timelineSeekCommitBusy || !isAdmin || !currentPlayingUrl) return false;

      timelineSeekCommitBusy = true;
      try {
        const res = await fetch('/api/playback-seek', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: telegramInitData,
            socketId: socket.id,
            expectedSongId: lastWinnerId(),
            position: Number(position) || 0,
            lockToken: timelineSeekLock.token
          })
        });
        const data = await res.json();
        if (data.lock) applyTimelineSeekLock(data.lock);
        if (data.playback) applyPlaybackState(data.playback, { forceSeek: true });
        return data.success === true;
      } catch (error) {
        console.error('❌ Lỗi tua timeline:', error);
        return false;
      } finally {
        timelineSeekCommitBusy = false;
      }
    }

    async function releaseTimelineSeekLock() {
      if (!timelineSeekOwner || !socket.connected) return;

      try {
        const res = await fetch('/api/playback-seek-lock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'release',
            initData: telegramInitData,
            socketId: socket.id,
            lockToken: timelineSeekLock.token
          })
        });
        const data = await res.json();
        if (data.lock) applyTimelineSeekLock(data.lock);
      } catch (error) {
        console.warn('⚠️ Không thể nhả quyền tua timeline:', error);
      } finally {
        timelineSeekOwner = false;
        timelineSeekDragging = false;
        updateTimelineSeekUI();
      }
    }

    let timelineSeekAcquirePromise = null;

    async function beginTimelineSeek() {
      if (!isAdmin || !currentPlayingUrl || timelineSeekDragging) return false;
      if (timelineSeekAcquirePromise) return timelineSeekAcquirePromise;

      timelineSeekAcquirePromise = (async () => {
        const acquired = await claimTimelineSeekLock();
        if (!acquired) return false;
        timelineSeekDragging = true;
        updateTimelineSeekUI();
        updatePlaybackTimeline();
        return true;
      })();

      try {
        return await timelineSeekAcquirePromise;
      } finally {
        timelineSeekAcquirePromise = null;
      }
    }

    async function finishTimelineSeek() {
      const acquired = timelineSeekOwner || await beginTimelineSeek();
      if (!acquired || !timelineSeekOwner) return;

      const position = Number(playbackTimeline.value) || 0;

      // Kết thúc kéo trước khi commit để forceSeek có thể chạy ngay.
      timelineSeekDragging = false;
      updateTimelineSeekUI();

      // Nhảy ngay trên máy Admin.
      try {
        if (youtubeApiPlayer && youtubePlayerReady) {
          youtubeApiPlayer.seekTo(position, true);
        }
      } catch (error) {
        console.warn('⚠️ Không seek cục bộ được:', error);
      }

      await commitTimelineSeek(position);
      await releaseTimelineSeekLock();
      updatePlaybackTimeline();
    }

    playbackTimeline?.addEventListener('pointerdown', async (event) => {
      if (!isAdmin || playbackTimeline.disabled) return;
      event.preventDefault();
      try { playbackTimeline.setPointerCapture?.(event.pointerId); } catch (_) {}
      await beginTimelineSeek();
    });

    playbackTimeline?.addEventListener('input', () => {
      if (!timelineSeekOwner) return;
      // Chỉ thay đổi preview cục bộ; server chỉ nhận mốc cuối khi nhả tay.
      const duration = Number(playbackTimeline.max) || 0;
      const position = Math.max(0, Math.min(Number(playbackTimeline.value) || 0, duration || Infinity));
      playbackTime.textContent = `${formatPlaybackTime(position)} / ${formatPlaybackTime(duration)}`;
    });

    playbackTimeline?.addEventListener('pointerup', async (event) => {
      try { playbackTimeline.releasePointerCapture?.(event.pointerId); } catch (_) {}
      await finishTimelineSeek();
    });

    // Một số WebView/thiết bị không luôn phát pointerup đúng với input range.
    // change là fallback chuẩn của <input type=range> sau khi người dùng nhả tay.
    playbackTimeline?.addEventListener('change', async () => {
      if (!timelineSeekOwner || !timelineSeekDragging) return;
      await finishTimelineSeek();
    });

    playbackTimeline?.addEventListener('pointercancel', async () => {
      if (!timelineSeekOwner) return;
      await releaseTimelineSeekLock();
      updatePlaybackTimeline();
    });

    socket.on('playbackSeekLock', (payload) => {
      applyTimelineSeekLock(payload || {});
    });

    function updatePlaybackToggle() {
      if (!btnPlaybackToggle) return;

      const isPlaying = currentPlayback.status === 'playing' || currentPlayback.status === 'scheduled';
      btnPlaybackToggle.textContent = isPlaying ? '⏸️' : '▶️';
      btnPlaybackToggle.setAttribute('aria-label', isPlaying ? 'Tạm dừng' : 'Phát');
      btnPlaybackToggle.setAttribute('title', isAdmin ? (isPlaying ? 'Tạm dừng cho tất cả' : 'Phát cho tất cả') : 'Chỉ Admin được điều khiển');
      btnPlaybackToggle.disabled = !isAdmin || !currentPlayingUrl;
      btnPlaybackToggle.classList.toggle('admin-enabled', isAdmin && !!currentPlayingUrl);
      updateTimelineSeekUI();
      updatePlaybackTimeline();
    }

    async function sendPlaybackControl(action) {
      if (!isAdmin || !currentPlayingUrl || !socket.connected) return;

      btnPlaybackToggle.disabled = true;
      try {
        const res = await fetch('/api/playback-control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action,
            initData: telegramInitData,
            socketId: socket.id,
            expectedSongId: lastWinnerId()
          })
        });
        const data = await res.json();
        if (!data.success && data.message) {
          console.log('🎬 Playback control:', data.message);
        }
        if (data.playback) {
          applyPlaybackState(data.playback, { forceSeek: true });
        }
      } catch (error) {
        console.error('❌ Lỗi điều khiển playback:', error);
      } finally {
        updatePlaybackToggle();
      }
    }

    btnPlaybackToggle?.addEventListener('click', () => {
      if (!isAdmin) return;
      const nextAction = currentPlayback.status === 'playing' ? 'pause' : 'play';
      sendPlaybackControl(nextAction);
    });

    socket.on('playbackState', (state) => {
      applyPlaybackState(state, { forceSeek: true });
    });

    socket.on('playbackSync', (state) => {
      applyPlaybackState(state);
    });

    function reportPlaybackPosition() {
      if (playbackSyncBusy || timelineSeekDragging || timelineSeekCommitBusy || !youtubeApiPlayer || !youtubePlayerReady) return;
      if (!currentPlayback.songId || !currentPlayingUrl) return;
      if (currentPlayback.authoritySocketId !== socket.id) return;
      if (currentPlayback.status !== 'playing' && currentPlayback.status !== 'paused') return;

      playbackSyncBusy = true;
      try {
        const position = Number(youtubeApiPlayer.getCurrentTime?.() || 0);
        socket.emit('playbackReport', {
          songId: currentPlayback.songId,
          position,
          status: currentPlayback.status,
          version: currentPlayback.version
        });
      } catch (error) {
        console.warn('⚠️ Không lấy được vị trí YouTube:', error);
      } finally {
        playbackSyncBusy = false;
      }
    }

    playbackSyncTimer = window.setInterval(reportPlaybackPosition, 2000);

    function onYouTubePlayerStateChange(event) {
      console.log('🎬 YouTube state:', event.data);

      if (typeof YT !== 'undefined' && event.data === YT.PlayerState.PLAYING) {
        reportPlaybackPosition();
      } else if (typeof YT !== 'undefined' && event.data === YT.PlayerState.PAUSED) {
        reportPlaybackPosition();
      }

      if (
        typeof YT !== 'undefined' &&
        event.data === YT.PlayerState.ENDED
      ) {
        console.log('🏁 BÀI HÁT ĐÃ KẾT THÚC');
        handleAutoPlayEnded();
      }
    }

    async function handleAutoPlayEnded() {
      // Chỉ đúng Admin đang giữ quyền điều khiển Auto Play mới được chuyển bài.
      if (!window.isAdmin || !autoPlayController) {
        return;
      }

      if (autoPlayMode === 0) {
        return;
      }

      if (autoPlayNextBusy) {
        console.log('⏳ Auto Play đang xử lý bài tiếp theo...');
        return;
      }

      autoPlayNextBusy = true;
      const endedSongId = lastWinnerId();

      try {
        const res = await fetch('/api/auto-play-next', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            initData: telegramInitData,
            socketId: socket.id,
            expectedSongId: endedSongId
          })
        });

        const data = await res.json();

        if (!data.success) {
          console.log('⏹ Auto Play dừng:', data.message);

          if (data.stopAutoPlay) {
            autoPlayMode = 0;
            autoPlayController = false;
            autoPlayControllerSocketId = null;
            updateAutoPlayButton();
          }

          return;
        }

        console.log('▶️ Auto Play chuyển bài:', data.song);
      } catch (error) {
        console.error('❌ Lỗi Auto Play:', error);
      } finally {
        autoPlayNextBusy = false;
      }
    }

    function isYouTubeUrl(inputUrl) {
      try {
        const url = new URL(inputUrl.trim());

        const hostname = url.hostname
          .toLowerCase()
          .replace(/^www\./, '');

        if (
          hostname === 'youtube.com' ||
          hostname === 'm.youtube.com' ||
          hostname === 'music.youtube.com'
        ) {
          if (url.searchParams.get('v')) {
            return true;
          }

          const parts = url.pathname
            .split('/')
            .filter(Boolean);

          return (
            parts.length >= 2 &&
            ['shorts', 'embed', 'live'].includes(parts[0])
          );
        }

        if (hostname === 'youtu.be') {
          return url.pathname
            .split('/')
            .filter(Boolean)
            .length > 0;
        }

        return false;
      } catch {
        return false;
      }
    }
    function updateAutoPlayButton() {
      if (!btnAutoPlay) return;

      if (autoPlayMode === 1) {
        btnAutoPlay.textContent = '🔢 Tuần tự';
        btnAutoPlay.style.background = '#2e7d32';
      }

      else if (autoPlayMode === 2) {
        btnAutoPlay.textContent = '🔀 Ngẫu nhiên';
        btnAutoPlay.style.background = '#00aaff';
      }

      else {
        btnAutoPlay.textContent = '▶️ Tự động';
        btnAutoPlay.style.background = '#37474f';
      }
    }
    
btnAutoPlay.addEventListener('click', async () => {
  if (!window.isAdmin) {
    alert('Bạn không có quyền Admin!');
    return;
  }

  let nextMode;

  if (autoPlayMode === 0) {
    nextMode = 1;
  } else if (autoPlayMode === 1) {
    nextMode = 2;
  } else {
    nextMode = 0;
  }

  btnAutoPlay.disabled = true;

  try {
    const res = await fetch('/api/auto-play-mode', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        mode: nextMode,
        initData: telegramInitData,
        socketId: socket.id
      })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.message || 'Không thể đổi chế độ Auto Play!');
      return;
    }

    autoPlayMode = Number(data.mode) || 0;
    autoPlayControllerSocketId = data.controllerSocketId || null;
    autoPlayController = autoPlayControllerSocketId === socket.id;

    updateAutoPlayButton();

    console.log(
      '🎵 Auto Play Mode:',
      autoPlayMode,
      '| controller:',
      autoPlayControllerSocketId
    );

    // Nếu vừa bật Auto Play mà chưa có bài đang phát,
    // yêu cầu server chọn bài đầu tiên ngay lập tức.
    if (autoPlayMode !== 0 && !data.hasCurrentSong && autoPlayController) {
      const nextRes = await fetch('/api/auto-play-next', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: telegramInitData,
          socketId: socket.id
        })
      });

      const nextData = await nextRes.json();

      if (!nextData.success && nextData.stopAutoPlay) {
        autoPlayMode = 0;
        autoPlayController = false;
        autoPlayControllerSocketId = null;
        updateAutoPlayButton();
      }
    }
  } catch (error) {
    console.error('❌ Lỗi đổi Auto Play:', error);
    alert('Lỗi kết nối!');
  } finally {
    btnAutoPlay.disabled = false;
  }
});

updateAutoPlayButton();

    function startSpinAnimation(targetIndex, winner, shouldPlaySound, action = currentAction) {
      if (isSpinning) return;
      isSpinning = true;
      btnSpin.disabled = true;

      clearPlayer();

      const numSlices = songs.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const targetSliceStartAngle = targetIndex * sliceAngle;
      const targetSliceCenterAngle = targetSliceStartAngle + sliceAngle / 2;
      const extraSpins = 5 * 2 * Math.PI;
      const desiredFinalAngle = (1.5 * Math.PI) - targetSliceCenterAngle;
      const startAngle = currentAngle % (2 * Math.PI);
      const totalRotation = extraSpins + (desiredFinalAngle - startAngle);
      
      let startTime = null;
      const duration = 4000;

      function animateSpin(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        
        currentAngle = startAngle + totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          btnSpin.disabled = songs.length === 0;
          renderPlayer(winner, shouldPlaySound, action);
          playerCard.scrollIntoView({ behavior: 'smooth' });
        }
      }

      requestAnimationFrame(animateSpin);
    }

    btnSubmit.addEventListener('click', async () => {
      const url = songUrlInput.value.trim();
      if (!url) return alert('Vui lòng nhập link!');
      
      btnSubmit.disabled = true;
      try {
        const cleanUrl = url.trim();

        if (!isYouTubeUrl(cleanUrl)) {
          alert('❌ Vui lòng nhập link YouTube hợp lệ!');
          return;
        }
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
          url: cleanUrl,
          initData: telegramInitData
        })
        });
        const data = await res.json();
        if (data.success) songUrlInput.value = '';
        else alert(data.message);
      } catch (e) { 
        alert('Lỗi kết nối!'); 
      } finally { 
        btnSubmit.disabled = !isFormOpen; 
      }
    });

    btnSpin.addEventListener('click', async () => {
      if (isSpinning || songs.length === 0 || songActionLock.active) return;
      try {
        const res = await fetch('/api/spin', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: telegramInitData,
            socketId: socket.id
          })
        });
        const data = await res.json();
        if (!data.success) {
          alert(data.message);
        }
      } catch (e) {
        alert('Lỗi khi quay!');
      }
    });

    btnToggleForm.addEventListener('click', () => {
      fetch('/api/toggle-form', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: telegramInitData
        })
      });
    });

    btnReset.addEventListener('click', () => {
      if (confirm('Xóa tất cả bài hát?')) {
        clearPlayer();
        fetch('/api/reset', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: telegramInitData,
            socketId: socket.id
          })
        });
      }
    });
  </script>
