<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GEMS Radio — Quản lý Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:0 14px 28px; font-family:Arial,sans-serif; background:#f5f7fa; color:#222; }
    .header { max-width:720px; margin:0 auto; padding:18px 0 12px; text-align:center; }
    .header h1 { margin:0; font-size:22px; }
    .page { max-width:720px; margin:0 auto; }
    .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
    .status { font-size:13px; margin-bottom:12px; min-height:18px; }
    .status.error { color:#b3261e; } .status.success { color:#2e7d32; } .status.info { color:#555; }
    .section-title { margin:0 0 12px; font-size:17px; }
    .admin-list { display:grid; gap:10px; }
    .admin-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border:1px solid #e2e6eb; border-radius:10px; background:#fafbfc; }
    .admin-info { min-width:0; flex:1; } .admin-name { font-weight:600; overflow-wrap:anywhere; }
    .admin-meta { margin-top:4px; font-size:12px; color:#666; overflow-wrap:anywhere; }
    .role-badge { display:inline-block; margin-top:6px; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; background:#eef3f8; color:#456; }
    button { border:0; border-radius:9px; min-height:36px; padding:0 12px; cursor:pointer; font-size:14px; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .btn-primary { background:#1976d2; color:#fff; } .btn-danger { background:#d32f2f; color:#fff; } .btn-secondary { background:#e9edf2; color:#333; }
    .form-row { display:flex; gap:10px; }
    .form-row input { flex:1; min-width:0; height:38px; padding:0 11px; border:1px solid #cbd2d9; border-radius:9px; font-size:14px; outline:none; }
    .form-row input:focus { border-color:#1976d2; }
    .hint { margin-top:9px; font-size:12px; color:#666; line-height:1.4; }
    .empty { color:#777; font-size:14px; padding:8px 0; }
    .back-link { display:inline-block; margin-bottom:12px; color:#1976d2; text-decoration:none; font-size:14px; }
    @media (max-width:520px) { .form-row { flex-direction:column; } .admin-row { align-items:flex-start; } .admin-row button { flex:0 0 auto; } }
  </style>
</head>
<body>
  <div class="header"><h1>👑 Quản lý Admin</h1></div>
  <main class="page">
    <a class="back-link" href="/">← Quay lại GEMS Radio</a>
    <section class="card">
      <div id="status" class="status info" aria-live="polite">⏳ Đang xác thực Owner...</div>
      <h2 class="section-title">Danh sách Admin</h2>
      <div id="adminList" class="admin-list"><div class="empty">Đang tải...</div></div>
    </section>
    <section id="grantCard" class="card" hidden>
      <h2 class="section-title">➕ Cấp quyền Admin</h2>
      <div class="form-row">
        <input id="telegramIdInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập Telegram ID">
        <button id="grantButton" class="btn-primary" type="button">Cấp quyền</button>
      </div>
      <div class="hint">Nhập Telegram ID của tài khoản cần cấp quyền. Quyền được kiểm tra và lưu ở server.</div>
    </section>
    <section class="card" id="refreshCard" hidden>
      <button id="refreshButton" class="btn-secondary" type="button">↻ Làm mới danh sách</button>
    </section>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { try { tg.ready(); } catch(e) {} try { tg.expand(); } catch(e) {} }
    let telegramInitData = tg?.initData || '';
    function resolveTelegramInitData() { const data=tg?.initData||''; if(data) telegramInitData=data; return telegramInitData; }
    const statusEl=document.getElementById('status'), adminListEl=document.getElementById('adminList'), grantCard=document.getElementById('grantCard'), refreshCard=document.getElementById('refreshCard'), telegramIdInput=document.getElementById('telegramIdInput'), grantButton=document.getElementById('grantButton'), refreshButton=document.getElementById('refreshButton');
    let ownerAuthorized=false;
    function setStatus(message,type='info'){ statusEl.textContent=message; statusEl.className=`status ${type}`; }
    function escapeHtml(value){ return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function getDisplayName(admin){ const full=[admin.first_name,admin.last_name].filter(Boolean).join(' ').trim(); return full || (admin.username ? '@'+admin.username : 'Telegram user'); }
    function renderAdmins(admins){
      if(!Array.isArray(admins)||admins.length===0){ adminListEl.innerHTML='<div class="empty">Chưa có tài khoản Admin nào trong cơ sở dữ liệu.</div>'; return; }
      adminListEl.innerHTML=admins.map(admin=>{
        const isOwner=admin.role==='owner', name=escapeHtml(getDisplayName(admin)), username=admin.username?`@${escapeHtml(admin.username)}`:'', id=escapeHtml(admin.telegram_id), meta=username?`${username} · Telegram ID: ${id}`:`Telegram ID: ${id}`;
        const action=isOwner?'<button class="btn-secondary" type="button" disabled>Owner</button>':`<button class="btn-danger revoke-button" type="button" data-telegram-id="${id}">Thu hồi</button>`;
        return `<div class="admin-row"><div class="admin-info"><div class="admin-name">${name}</div><div class="admin-meta">${meta}</div><span class="role-badge">${isOwner?'Owner':'Admin'}</span></div>${action}</div>`;
      }).join('');
      adminListEl.querySelectorAll('.revoke-button').forEach(btn=>btn.addEventListener('click',()=>revokeAdmin(btn.dataset.telegramId)));
    }
    async function fetchAdmins(){
      resolveTelegramInitData();
      if(!telegramInitData){ setStatus('⚠️ Không nhận được Telegram initData. Hãy mở trang từ Telegram Mini App.','error'); adminListEl.innerHTML='<div class="empty">Không thể xác thực.</div>'; return false; }
      setStatus('⏳ Đang tải danh sách Admin...');
      try{
        const response=await fetch(`/api/admin-users?initData=${encodeURIComponent(telegramInitData)}`,{method:'GET',cache:'no-store'}), data=await response.json().catch(()=>({}));
        if(!response.ok||data.success!==true){ ownerAuthorized=false; grantCard.hidden=true; refreshCard.hidden=true; adminListEl.innerHTML='<div class="empty">Bạn không có quyền truy cập trang quản lý Admin.</div>'; setStatus(`❌ ${data.message||'Không thể tải danh sách Admin.'}`,'error'); return false; }
        ownerAuthorized=true; grantCard.hidden=false; refreshCard.hidden=false; renderAdmins(data.admins); setStatus('✅ Đã xác thực Owner.','success'); return true;
      }catch(error){ console.error('Admin list error:',error); setStatus('❌ Lỗi kết nối máy chủ.','error'); return false; }
    }
    async function grantAdmin(){
      if(!ownerAuthorized) return; const telegramId=telegramIdInput.value.trim();
      if(!/^\d+$/.test(telegramId)){ setStatus('⚠️ Telegram ID không hợp lệ.','error'); telegramIdInput.focus(); return; }
      grantButton.disabled=true;
      try{
        const response=await fetch('/api/admin-users/grant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegramId,initData:telegramInitData})}), data=await response.json().catch(()=>({}));
        if(!response.ok||data.success!==true){ setStatus(`❌ ${data.message||'Không thể cấp quyền Admin.'}`,'error'); return; }
        telegramIdInput.value=''; setStatus('✅ Đã cấp quyền Admin.','success'); await fetchAdmins();
      }catch(error){ console.error('Grant admin error:',error); setStatus('❌ Lỗi kết nối máy chủ.','error'); }
      finally{ grantButton.disabled=false; }
    }
    async function revokeAdmin(telegramId){
      if(!ownerAuthorized||!confirm(`Thu hồi quyền Admin của Telegram ID ${telegramId}?`)) return;
      const buttons=[...adminListEl.querySelectorAll('.revoke-button')], button=buttons.find(b=>b.dataset.telegramId===telegramId); if(button) button.disabled=true;
      try{
        const response=await fetch('/api/admin-users/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegramId,initData:telegramInitData})}), data=await response.json().catch(()=>({}));
        if(!response.ok||data.success!==true){ setStatus(`❌ ${data.message||'Không thể thu hồi quyền Admin.'}`,'error'); return; }
        setStatus('✅ Đã thu hồi quyền Admin.','success'); await fetchAdmins();
      }catch(error){ console.error('Revoke admin error:',error); setStatus('❌ Lỗi kết nối máy chủ.','error'); }
      finally{ if(button) button.disabled=false; }
    }
    grantButton.addEventListener('click',grantAdmin);
    telegramIdInput.addEventListener('keydown',event=>{if(event.key==='Enter') grantAdmin();});
    refreshButton.addEventListener('click',fetchAdmins);
    function waitForTelegramInitData(){
      if(resolveTelegramInitData()){ fetchAdmins(); return; }
      const startedAt=Date.now(), timer=setInterval(()=>{ if(resolveTelegramInitData()){clearInterval(timer);fetchAdmins();return;} if(Date.now()-startedAt>=15000){clearInterval(timer);fetchAdmins();} },250);
    }
    waitForTelegramInitData();
  </script>
</body>
</html>
